# Docker Compose 配置 - 支持完整的 ClickHouse 服务
# 支持 Docker 和非 Docker 两种启动方式
# 
# Docker 启动: docker compose up -d
# 非 Docker: 使用现有的共享容器或本地安装

version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: data4bt-clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"  # HTTP接口
      - "9000:9000"  # Native接口
    volumes:
      # 配置文件
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
      # 数据库初始化脚本
      - ./docker/clickhouse/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
      # 数据持久化
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    environment:
      - CLICKHOUSE_DB=data4BT
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=123456
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - data4bt-network

volumes:
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local

networks:
  data4bt-network:
    driver: bridge

# 备注：连接信息
# - 地址: localhost:9000 (Native) / localhost:8123 (HTTP)
# - 用户: default  
# - 密码: 123456
# - 数据库: data4BT