# 币安数据加载器优化配置文件 - 针对网络问题优化

# 日志配置
log:
  level: "info"  # 减少debug输出，提高性能
  format: "json"
  output: "stdout"
  file_path: "logs/app.log"

# 币安数据源配置 - 网络优化
binance:
  base_url: "https://data.binance.vision"
  data_path: "/data/spot/monthly/klines"  # 改为月数据，减少网络请求
  symbols_filter: "USDT"
  interval: "1m"
  timeout: 120s          # 增加超时时间应对网络慢
  retry_count: 5         # 增加重试次数
  retry_delay: 15s       # 增加重试延迟
  connection_timeout: 60s # 添加连接超时
  read_timeout: 300s     # 添加读取超时，适应大文件下载
  keep_alive: true       # 启用连接复用
  max_idle_conns: 100    # 增加空闲连接数
  max_conns_per_host: 10 # 每个主机的最大连接数
  
# 下载器配置 - 降低并发减少网络压力
downloader:
  concurrency: 3         # 降低并发数，避免网络拥堵
  buffer_size: 50        # 减少缓冲区
  user_agent: "BinanceDataLoader/1.0"
  enable_compression: true
  max_file_size: 500MB   # 月数据文件更大
  chunk_size: 8192       # 设置分块下载大小
  progress_report_interval: 30s # 下载进度报告间隔

# 解析器配置
parser:
  concurrency: 3         # 降低并发数
  buffer_size: 30
  validate_data: true
  skip_invalid_rows: true
  memory_limit: 1GB      # 限制内存使用

# 数据库配置 - 批处理优化
database:
  clickhouse:
    hosts:
      - "localhost:9000"
    database: "data4BT"
    username: "default"
    password: "123456"
    settings:
      max_execution_time: 300      # 增加执行时间限制
      max_memory_usage: 20000000000 # 增加内存限制
      max_threads: 4               # 限制线程数
      max_insert_block_size: 100000 # 优化插入块大小
    compression: "lz4"
    dial_timeout: 60s
    max_open_conns: 5      # 降低连接数
    max_idle_conns: 2
    conn_max_lifetime: 30m

# 导入器配置 - 大批处理优化
importer:
  batch_size: 50000      # 增加批量大小，减少网络IO
  buffer_size: 10        # 减少缓冲区
  flush_interval: 120s   # 增加刷新间隔
  enable_deduplication: true
  memory_threshold: 2GB  # 内存阈值

# 状态管理配置
state:
  storage_type: "file"
  file_path: "state/progress.json"
  backup_count: 3
  save_interval: 30s     # 降低保存频率

# 物化视图配置
materialized_views:
  enabled: true
  intervals:
    - "5m"
    - "15m" 
    - "1h"
    - "4h"
    - "1d"
  refresh_interval: 5m   # 降低刷新频率
  parallel_refresh: false # 关闭并行避免资源竞争

# 监控配置
monitoring:
  enabled: true
  metrics_port: 8080
  health_check_port: 8081
  progress_report_interval: 60s # 降低报告频率

# 调度配置 - 减少并发压力
scheduler:
  end_date: ""
  batch_days: 30           # 增加批处理天数，按月处理
  max_concurrent_symbols: 1 # 降低并发数，逐个处理交易对
  symbols_per_batch: 10    # 每批处理的交易对数量
  batch_delay: 10s         # 批次间延迟

# 网络重试策略
retry_strategy:
  initial_delay: 1s
  max_delay: 300s
  multiplier: 2.0
  jitter: true
  max_retries: 10

# 资源限制
resource_limits:
  max_memory: 4GB
  max_goroutines: 100
  gc_percent: 50

# 错误处理
error_handling:
  continue_on_error: true    # 遇到错误继续处理其他交易对
  max_consecutive_errors: 5  # 最大连续错误数
  error_cooldown: 300s       # 错误冷却时间