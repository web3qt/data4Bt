# 生产环境配置文件
# 适用于生产环境，优化性能、稳定性和监控

# 日志配置 - 生产环境使用结构化日志和适当级别
log:
  level: "warn"            # 生产环境使用warn级别，减少日志量
  format: "json"           # 使用JSON格式，便于日志聚合和分析
  output: "file"           # 输出到文件
  file_path: "logs/prod.log"

# 币安数据源配置 - 生产环境优化
binance:
  base_url: "https://data.binance.vision"
  data_path: "/data/spot/daily/klines"
  symbols_filter: "USDT"   # 生产环境可根据需要调整
  interval: "1m"
  timeout: 120s            # 生产环境增加超时时间
  retry_count: 10          # 生产环境增加重试次数
  retry_delay: 10s         # 生产环境增加重试延迟
  proxy_url: ""            # 生产环境代理配置（如需要）

# 下载器配置 - 生产环境高并发
downloader:
  concurrency: 20          # 生产环境高并发
  buffer_size: 200
  user_agent: "BinanceDataLoader-Prod/1.0"
  enable_compression: true
  max_file_size: "500MB"   # 生产环境支持大文件

# 解析器配置 - 生产环境高并发
parser:
  concurrency: 10          # 生产环境高并发
  buffer_size: 100
  validate_data: true      # 生产环境启用数据验证
  skip_invalid_rows: true  # 生产环境跳过无效行，保证稳定性

# 数据库配置 - 生产环境高性能配置
database:
  clickhouse:
    hosts: 
      - "localhost:9000"  # 本地开发环境，生产环境请修改为实际地址
    database: "data4BT"
    username: "default"  # 生产环境请修改为实际用户名
    password: "qCWtqZzu8Lj2"    # 生产环境请修改为实际密码
    settings:
      max_memory_usage: 4000000000      # 4GB内存限制
      max_threads: 16
      max_execution_time: 3600          # 1小时执行时间限制
    compression: "lz4"
    dial_timeout: 60s
    max_open_conns: 50       # 生产环境高连接数
    max_idle_conns: 20
    conn_max_lifetime: 30m

# 导入器配置 - 生产环境大批次
importer:
  batch_size: 50000        # 生产环境大批次
  buffer_size: 100
  flush_interval: 60s      # 生产环境较长刷新间隔
  enable_deduplication: true

# 状态管理配置 - 生产环境
state:
  storage_type: "file"
  file_path: "state/prod_progress.json"
  backup_count: 10         # 生产环境更多备份
  save_interval: 30s       # 生产环境较长保存间隔

# 物化视图配置 - 生产环境完整配置
materialized_views:
  enabled: true
  intervals: ["5m", "15m", "1h", "4h", "1d"]  # 生产环境完整间隔
  refresh_interval: 5m     # 生产环境较长刷新间隔
  parallel_refresh: true   # 生产环境启用并行刷新

# 监控配置 - 生产环境完整监控
monitoring:
  enabled: true
  metrics_port: 8080
  health_check_port: 8081
  progress_report_interval: 300s  # 生产环境较长报告间隔
  web_dashboard:
    enabled: true
    port: 8890
    auto_start: true
    refresh_interval: 30s    # 生产环境较长刷新间隔
    show_worker_status: true
    show_realtime_progress: true

# 调度器配置 - 生产环境高性能
scheduler:
  end_date: ""             # 生产环境使用当前日期
  batch_days: 7            # 生产环境大批次
  max_concurrent_symbols: 10  # 生产环境高并发
  timeline_cache_duration: 24h
  auto_discover_symbols: true
  show_startup_overview: false  # 生产环境不显示启动概览

# 生产环境配置说明：
#
# 1. 安全配置：
#    - 修改数据库用户名和密码为生产环境实际值
#    - 配置实际的数据库服务器地址
#    - 移除或配置代理设置
#
# 2. 性能调优：
#    - 根据服务器规格调整并发数和内存限制
#    - 监控系统资源使用情况
#    - 根据数据量调整批次大小
#
# 3. 监控配置：
#    - 配置日志文件路径和轮转策略
#    - 设置监控端口和健康检查
#    - 配置告警阈值
