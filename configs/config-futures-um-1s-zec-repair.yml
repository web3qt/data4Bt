# USDT-M futures 1s ZEC repair import configuration

log:
  level: "info"
  format: "json"
  output: "file"
  file_path: "logs/futures_um_1s_zec_repair.log"

binance:
  base_url: "https://data.binance.vision"
  data_path: "/data/futures/um/daily/aggTrades"
  market_type: "futures_um"
  exchange_info_url: ""
  explicit_symbols:
    - "ZECUSDT"
  symbols_filter: "USDT"
  interval: "1s"
  timeout: 600s
  retry_count: 8
  retry_delay: 10s
  proxy_url: ""

downloader:
  concurrency: 4
  buffer_size: 100
  user_agent: "BinanceDataLoader/1.0"
  enable_compression: true
  max_file_size: "1GB"

parser:
  concurrency: 4
  buffer_size: 100
  validate_data: true
  skip_invalid_rows: true
  interval: "1s"

database:
  clickhouse:
    hosts:
      - "localhost:9000"
    database: "data4BT_futures_um_1s"
    base_table: "klines_1s"
    username: "default"
    password: "123456"
    settings:
      max_execution_time: 7200
      max_memory_usage: 8000000000
      max_threads: 8
    compression: "lz4"
    dial_timeout: 60s
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 30m

importer:
  batch_size: 50000
  buffer_size: 200000
  flush_interval: 30s
  enable_deduplication: true

state:
  storage_type: "file"
  file_path: "state/futures_um_1s_zec_repair/progress.json"
  backup_count: 5
  save_interval: 30s

materialized_views:
  enabled: false
  intervals: []
  refresh_interval: 5m
  parallel_refresh: false

monitoring:
  enabled: false
  metrics_port: 8906
  health_check_port: 8907
  progress_report_interval: 60s
  web_dashboard:
    enabled: false
    port: 8908
    auto_start: false
    refresh_interval: 30s
    show_worker_status: true
    show_realtime_progress: true

scheduler:
  start_date: "2026-01-08"
  end_date: "2026-02-08"
  batch_days: 32
  max_concurrent_symbols: 1
  timeline_cache_duration: 24h
  auto_discover_symbols: false
  show_startup_overview: false
