<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>币安数据加载器 - 监控仪表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .status-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .status-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .status-label {
            color: #666;
            font-size: 0.9rem;
        }
        
        .status-good { color: #27ae60; }
        .status-warning { color: #f39c12; }
        .status-error { color: #e74c3c; }
        .status-info { color: #3498db; }
        
        .progress-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #ecf0f1;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border-radius: 15px;
            transition: width 0.5s ease;
            position: relative;
        }
        
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        
        .symbols-table {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }
        
        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .search-box {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            min-width: 250px;
        }
        
        .search-box:focus {
            border-color: #3498db;
        }
        
        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .filter-btn.active,
        .filter-btn:hover {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .data-table th {
            background: #f8f9fa;
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
            position: sticky;
            top: 0;
        }
        
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .data-table tr:hover {
            background: #f8f9fa;
        }
        
        .symbol-name {
            font-weight: bold;
            color: #2c3e50;
        }
        
        .record-count {
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            min-width: 60px;
            display: inline-block;
        }
        
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .refresh-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #3498db;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            transition: all 0.3s ease;
        }
        
        .refresh-button:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        
        .last-update {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            .status-cards {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
            
            .table-controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                min-width: auto;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 币安数据加载器</h1>
            <p>实时监控您的加密货币数据采集进度</p>
        </div>
        
        <div class="status-cards" id="statusCards">
            <div class="card">
                <h3>📊 总交易对数</h3>
                <div class="status-value status-info" id="totalSymbols">-</div>
                <div class="status-label">已监控的交易对</div>
            </div>
            <div class="card">
                <h3>✅ 有数据交易对</h3>
                <div class="status-value status-good" id="symbolsWithData">-</div>
                <div class="status-label">包含历史数据</div>
            </div>
            <div class="card">
                <h3>📈 总记录数</h3>
                <div class="status-value status-info" id="totalRecords">-</div>
                <div class="status-label">1分钟K线数据</div>
            </div>
            <div class="card">
                <h3>🔗 数据库状态</h3>
                <div class="status-value status-good" id="dbStatus">连接中</div>
                <div class="status-label">ClickHouse</div>
            </div>
        </div>
        
        <div class="progress-section">
            <h3>📊 整体处理进度</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%">
                    <div class="progress-text" id="progressText">加载中...</div>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; color: #666;">
                <span>已完成: <strong id="completedTasks">0</strong></span>
                <span>总任务: <strong id="totalTasks">0</strong></span>
            </div>
        </div>
        
        <div class="symbols-table">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>📋 交易对详细状态</h3>
                <div class="last-update" id="lastUpdate">最后更新: -</div>
            </div>
            
            <div class="table-controls">
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜索交易对...">
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterTable('all')">全部</button>
                    <button class="filter-btn" onclick="filterTable('active')">有数据</button>
                    <button class="filter-btn" onclick="filterTable('pending')">待处理</button>
                </div>
            </div>
            
            <div class="loading" id="loading">🔄 正在加载数据...</div>
            <div class="error-message" id="errorMessage" style="display: none;">
                ❌ 无法连接到数据源。请确保数据加载器正在运行。
            </div>
            
            <table class="data-table" id="dataTable" style="display: none;">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">交易对 ↕️</th>
                        <th onclick="sortTable(1)">记录数 ↕️</th>
                        <th onclick="sortTable(2)">最早时间 ↕️</th>
                        <th onclick="sortTable(3)">最新时间 ↕️</th>
                        <th onclick="sortTable(4)">时间跨度 ↕️</th>
                        <th onclick="sortTable(5)">最后处理 ↕️</th>
                        <th onclick="sortTable(6)">状态 ↕️</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>
    
    <button class="refresh-button" onclick="loadData()">
        🔄 刷新数据
    </button>
    
    <script>
        let allData = [];
        let currentFilter = 'all';
        
        // 页面加载时获取数据
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            // 每30秒自动刷新
            setInterval(loadData, 30000);
            
            // 搜索框事件
            document.getElementById('searchBox').addEventListener('input', function() {
                filterAndDisplayTable();
            });
        });
        
        async function loadData() {
            try {
                // 检查服务器状态（假设有状态检查工具）
                await loadSystemStatus();
                
                // 隐藏错误信息
                document.getElementById('errorMessage').style.display = 'none';
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dataTable').style.display = 'table';
                
            } catch (error) {
                console.error('Error loading data:', error);
                showError();
            }
        }
        
        async function loadSystemStatus() {
            // 模拟数据加载 - 在实际使用中，这里应该调用你的状态检查API
            // 你可以修改这部分来调用实际的API端点
            
            // 模拟数据
            const mockData = {
                totalSymbols: 150,
                symbolsWithData: 45,
                totalRecords: 1250000,
                databaseStatus: '已连接',
                lastUpdated: new Date().toISOString(),
                symbolDetails: generateMockSymbolData()
            };
            
            updateStatusCards(mockData);
            updateTable(mockData.symbolDetails);
            
            document.getElementById('lastUpdate').textContent = 
                '最后更新: ' + new Date(mockData.lastUpdated).toLocaleString('zh-CN');
        }
        
        function generateMockSymbolData() {
            const symbols = ['BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'ADAUSDT', 'DOTUSDT', 
                           'LINKUSDT', 'LTCUSDT', 'BCHUSDT', 'XLMUSDT', 'EOSUSDT'];
            return symbols.map((symbol, index) => ({
                symbol: symbol,
                recordCount: Math.floor(Math.random() * 100000) + 10000,
                earliestTime: new Date(2020 + Math.floor(Math.random() * 3), 
                                     Math.floor(Math.random() * 12), 
                                     Math.floor(Math.random() * 28)).toISOString(),
                latestTime: new Date().toISOString(),
                timeSpan: `${Math.floor(Math.random() * 1000) + 365} 天`,
                lastProcessed: new Date().toISOString(),
                status: index < 6 ? 'active' : 'pending'
            }));
        }
        
        function updateStatusCards(data) {
            document.getElementById('totalSymbols').textContent = data.totalSymbols.toLocaleString();
            document.getElementById('symbolsWithData').textContent = data.symbolsWithData.toLocaleString();
            document.getElementById('totalRecords').textContent = data.totalRecords.toLocaleString();
            document.getElementById('dbStatus').textContent = data.databaseStatus;
            
            // 更新进度条
            const progressPercent = (data.symbolsWithData / data.totalSymbols) * 100;
            document.getElementById('progressFill').style.width = progressPercent + '%';
            document.getElementById('progressText').textContent = 
                `${data.symbolsWithData} / ${data.totalSymbols} (${progressPercent.toFixed(1)}%)`;
            document.getElementById('completedTasks').textContent = data.symbolsWithData.toLocaleString();
            document.getElementById('totalTasks').textContent = data.totalSymbols.toLocaleString();
        }
        
        function updateTable(data) {
            allData = data;
            filterAndDisplayTable();
        }
        
        function filterAndDisplayTable() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            
            let filteredData = allData.filter(item => {
                const matchesSearch = item.symbol.toLowerCase().includes(searchTerm);
                
                if (currentFilter === 'all') return matchesSearch;
                if (currentFilter === 'active') return matchesSearch && item.recordCount > 0;
                if (currentFilter === 'pending') return matchesSearch && item.recordCount === 0;
                
                return matchesSearch;
            });
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            filteredData.forEach(item => {
                const row = tbody.insertRow();
                
                row.innerHTML = `
                    <td class="symbol-name">${item.symbol}</td>
                    <td class="record-count">${item.recordCount.toLocaleString()}</td>
                    <td>${formatDate(item.earliestTime)}</td>
                    <td>${formatDate(item.latestTime)}</td>
                    <td>${item.timeSpan}</td>
                    <td>${formatDate(item.lastProcessed)}</td>
                    <td><span class="status-badge status-${item.status}">${getStatusText(item.status)}</span></td>
                `;
            });
        }
        
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('zh-CN');
            } catch (e) {
                return 'N/A';
            }
        }
        
        function getStatusText(status) {
            const statusMap = {
                'active': '有数据',
                'pending': '待处理',
                'error': '错误'
            };
            return statusMap[status] || status;
        }
        
        function filterTable(filter) {
            currentFilter = filter;
            
            // 更新按钮样式
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            filterAndDisplayTable();
        }
        
        function sortTable(columnIndex) {
            // 简单的表格排序实现
            const table = document.getElementById('dataTable');
            const tbody = table.getElementsByTagName('tbody')[0];
            const rows = Array.from(tbody.getElementsByTagName('tr'));
            
            rows.sort((a, b) => {
                const aValue = a.cells[columnIndex].textContent;
                const bValue = b.cells[columnIndex].textContent;
                
                // 数字排序
                if (!isNaN(aValue.replace(/,/g, '')) && !isNaN(bValue.replace(/,/g, ''))) {
                    return parseInt(bValue.replace(/,/g, '')) - parseInt(aValue.replace(/,/g, ''));
                }
                
                // 字符串排序
                return aValue.localeCompare(bValue);
            });
            
            // 重新插入排序后的行
            rows.forEach(row => tbody.appendChild(row));
        }
        
        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('dataTable').style.display = 'none';
        }
    </script>
</body>
</html>
